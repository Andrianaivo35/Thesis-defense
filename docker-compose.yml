services:
  db:
    image: postgres:16-alpine
    container_name: stage-share-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fafah}
      POSTGRES_DB: ${DB_NAME:-stage-share}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./stage_share.sql:/docker-entrypoint-initdb.d/01-stage_share.sql:ro
      # Les migrations sont rejouees apres le dump (ordre alphabetique), pour
      # qu'un volume recree parte d'un schema a jour. L'entrypoint PostgreSQL
      # ne parcourt pas les sous-dossiers : chaque migration est montee ici.
      - ./scripts/migrations/001-rattachement-universite.sql:/docker-entrypoint-initdb.d/02-001-rattachement-universite.sql:ro
      - ./scripts/migrations/002-bibliotheque-cv.sql:/docker-entrypoint-initdb.d/02-002-bibliotheque-cv.sql:ro
      - ./scripts/migrations/003-referentiel-filieres.sql:/docker-entrypoint-initdb.d/02-003-referentiel-filieres.sql:ro
      - ./scripts/migrations/004-renommer-noteqcm.sql:/docker-entrypoint-initdb.d/02-004-renommer-noteqcm.sql:ro
      - ./scripts/migrations/005-categorie-react.sql:/docker-entrypoint-initdb.d/02-005-categorie-react.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-stage-share}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        JWT_SECRET: ${JWT_SECRET}
    container_name: stage-share-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-fafah}
      DB_NAME: ${DB_NAME:-stage-share}
    ports:
      - "3000:3000"
    volumes:
      # Fichiers televerses (CV, lettres). Hors de public/ : Next.js ne sert
      # ce dossier que dans l'etat ou il etait au moment du build, donc un
      # fichier ajoute a chaud y renvoyait 404. Un volume nomme garantit
      # aussi que les depots survivent a une reconstruction de l'image.
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
