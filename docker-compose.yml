services:
  db:
    image: postgres:16-alpine
    container_name: stage-share-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fafah}
      POSTGRES_DB: ${DB_NAME:-stage-share}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-stage-share}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        JWT_SECRET: ${JWT_SECRET}
    container_name: stage-share-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-fafah}
      DB_NAME: ${DB_NAME:-stage-share}
      # Prisma joint la base par le nom du service, pas par localhost :
      # le DATABASE_URL du fichier .env vaut pour le poste de
      # developpement, pas pour l'interieur du conteneur.
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-fafah}@db:5432/${DB_NAME:-stage-share}
    ports:
      - "3000:3000"
    volumes:
      # Fichiers televerses (CV, lettres). Hors de public/ : Next.js ne sert
      # ce dossier que dans l'etat ou il etait au moment du build, donc un
      # fichier ajoute a chaud y renvoyait 404. Un volume nomme garantit
      # aussi que les depots survivent a une reconstruction de l'image.
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads_data:
